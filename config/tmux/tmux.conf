# ---------------------------------------------------------------------------------------
# General Settings
set -g allow-passthrough on
set -g detach-on-destroy off
set -g renumber-windows on
set -g status on
set -g status-interval 1
set -g status-justify centre
set -sg escape-time 0


# ---------------------------------------------------------------------------------------
# Bindings

# `r` to reload the tmux configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Be as vim-like as possible
set -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi _ send -X start-of-line \; send -X next-non-whitespace

# Always open a new pane using the current path
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"


# ---------------------------------------------------------------------------------------
# Colors / Styles
#
# This line will let us see a sample of all the colors.
# set -g status-left '#[fg=colour0,bg=colour15] 0 #[fg=colour1,bg=colour14] 1 #[fg=colour2,bg=colour13] 2 #[fg=colour3,bg=colour12] 3 #[fg=colour4,bg=colour11] 4 #[fg=colour5,bg=colour10] 5 #[fg=colour6,bg=colour9] 6 #[fg=colour7,bg=colour8] 7 #[fg=colour8,bg=colour7] 8 #[fg=colour9,bg=colour6] 9 #[fg=colour10,bg=colour5]10 #[fg=colour11,bg=colour4]11 #[fg=colour12,bg=colour3]12 #[fg=colour13,bg=colour2]13 #[fg=colour14,bg=colour1]14 #[fg=colour15,bg=colour0]15 #[default]'

set -g status-style "fg=blue"
set -g pane-border-lines "heavy"
set -g pane-border-style "fg=black"
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=green,fg=blue}}"


# ---------------------------------------------------------------------------------------
# Window Status

setw -g window-status-separator "┋"

setw -g window-status-format " \
#{?#{==:#{@asc_window_state},done},#[fg=green bold],#{?#{==:#{@asc_window_state},blocked},#[fg=red bold],#[fg=white]}}\
#I:#W\
#{?#{==:#{@asc_window_state},active},#[fg=blue bold],}#{?@asc_window_icon, #{@asc_window_icon},}\
 #[default]"

setw -g window-status-current-format "\
#[bg=black fg=white bold] \
#I:#W#\
{?@asc_window_icon, #{?#{==:#{@asc_window_state},blocked},#[fg=red bold],}#{@asc_window_icon},}\
 #[default]\
"


# ---------------------------------------------------------------------------------------
# Left Status

set -g status-left-length 40
set -g status-left '#[fg=white bg=black]Session #[bg=default]#[fg=default] #S'


# ---------------------------------------------------------------------------------------
# Right Status

set -g status-right "#(~/setup/config/ai/ansible-monitor-tmux-status.sh) \
#[fg=white]%b %d \
#[fg=black bg=green bold] %H:%M #[default]\
#[fg=white bg=black] #(TZ=UTC date +%%H:%%M)#[fg=blue]Z #[default]\
"


# ---------------------------------------------------------------------------------------
# Multiple Status Lines

set -g status 3

# First line just has a block character which acts as a divider and matches the background of the active tab.
set -g status-format[0] "#[fg=black bg=default]#(printf '▂%.0s' $(seq 1 #{client_width}))"

# The original default status line.
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# More status information.
set -g status-format[2] "\
#[align=left fg=white]#{?@fleet_task_ticket,Running: #[fg=blue]#{@fleet_task_ticket},}#[default]\
#[align=centre fg=yellow]#{?@tw_active_task,▶ #{@tw_active_task},}#{?@tw_active_task_2, ▶ #{@tw_active_task_2},}#[default]\
#[align=right]\
#{?@asc_count_blocked,#[bg=red fg=white bold]#{@asc_icon_blocked}#{@asc_count_blocked}#[default] }\
#{?@asc_count_active,#[fg=blue]#{@asc_icon_active}#{@asc_count_active} #[default]}\
#{?@asc_count_done,#[fg=green]#{@asc_icon_done}#{@asc_count_done} #[default]}\
#{?@asc_ratelimit_claudecode_5h_pct,#[fg=blue bg=default bold]◆ claude \
#[fg=green bg=black nobold] 5h #{@asc_ratelimit_claudecode_5h_pct} #[fg=yellow]#{@asc_ratelimit_claudecode_5h_resets_in}#[fg=green]\
#{?@asc_ratelimit_claudecode_7d_pct, │ 7d #{@asc_ratelimit_claudecode_7d_pct} #[fg=yellow]#{@asc_ratelimit_claudecode_7d_resets_in},} \
#[default]}"



# ---------------------------------------------------------------------------------------
# Integrations (with other plugins)

# claude-tmux-flag.sh flags a window's @claude_state on Stop/Notification hooks; clear it once viewed
# set-hook -g after-select-window "set-window-option -u @claude_state"

# unified jump picker: agents, fleet task sessions, the fleet runtime
# session, home, and any other session, all in one fzf popup
bind-key -n M-p display-popup -E -w 90% -h 90% -T "Jump" "~/setup/config/tmux/tmux-jump-picker.sh"
bind-key -n M-w display-popup -E -w 60% -h 60% -T "Jira" "/home/jon/projects/jira-tui/dist/jira-tui"

# harpoon-style home-row binds: jump straight to home / the fleet runtime session
bind-key -n M-j switch-client -t home
bind-key -n M-h switch-client -t fleet

# actual harpoon plugin: bind and jump to session
# Alt-`l` and -`;` to jump. Include Shift to set.
bind-key -n M-k run 'harpoon -r 1'
bind-key -n M-K run 'harpoon -s 1'
bind-key -n M-L run 'harpoon -r 2'
bind-key -n M-l run 'harpoon -s 2'
bind-key -n M-: run 'harpoon -r 3'
bind-key -n M-\; run 'harpoon -s 3'

# ansible-monitor: view unreviewed master changes, marks them reviewed on close
bind-key -n M-g display-popup -E -w 80% -h 80% -T "Ansible Monitor" "/home/jon/.nvm/versions/node/v24.17.0/bin/node /home/jon/.nvm/versions/node/v24.17.0/bin/ansible-monitor report | less"


# ---------------------------------------------------------------------------------------
# Plugins
# run-shell ~/projects/agent-planning/tmux-agent-status/tmux-agent-status.tmux

# agent-status-collector binder: wraps the ASC binary and updates user-options for each
# session/window/pane, plus a quick jump action to get to an agent.
set -g @asc_refresh_interval 1
set -g @asc_icon_done "✓"
run-shell ~/projects/tmux-asc-binder/tmux-asc-binder.tmux

# scans your current pane for "URL-like" strings and opens them in your browser.
run-shell ~/projects/tmux-url-scanner/tmux-url-scanner.tmux

